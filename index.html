
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>VRiichi! | Player Portal</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #181824;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    main {
      box-sizing: border-box;
      width: min(420px, 92vw);
      text-align: center;
      padding: 32px;
    }
    h1 { color: #ff759d; font-size: 48px; }
    .sub { color: #cfcfdd; }
    button {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      font-size: 16px;
      border-radius: 9px;
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }
    .itch { background: #fa5c5c; color: white; }
    .google { background: white; color: #222; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    #account { display: none; }
    #status { color: #ffd4e1; min-height: 24px; }
    #details { overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h1>VRiichi!</h1>
  <p class="sub">Welcome to the Mahjong Parlor!</p>

  <section id="login">
    <button class="itch" disabled>
      Continue with itch.io — Coming Soon
    </button>
    <button class="google" id="google">
      Continue with Google
    </button>
  </section>

  <section id="account">
    <h2>Welcome back!</h2>
    <p id="details"></p>
    
<button id="test-link">
  Link itch.io Account
</button>

    <button id="logout">Sign Out</button>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
</main>

<script type="module">
import { createClient } from
  "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://wetnwnwkeednykajzqqs.supabase.co";
const SUPABASE_KEY = "sb_publishable_6fIMZv8NlFlEcfmUU-Dn7g_YpK__FBD";

const status = document.querySelector("#status");
const login = document.querySelector("#login");
const account = document.querySelector("#account");
const details = document.querySelector("#details");

const db = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    flowType: "pkce",
    detectSessionInUrl: false
  }
});

function showUser(user) {
  login.style.display = user ? "none" : "block";
  account.style.display = user ? "block" : "none";

  if (user) {
    details.textContent =
      "Signed in as " + (user.email || user.id);
  }
}

document.querySelector("#google").onclick = async () => {
  status.textContent = "Opening Google...";

  const { error } = await db.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: "https://vriichi-auth.pages.dev/"
    }
  });

  if (error) status.textContent = error.message;
};

document.querySelector("#logout").onclick = async () => {
  const { error } = await db.auth.signOut();

  if (error) {
    status.textContent = error.message;
    return;
  }

  showUser(null);
  status.textContent = "Signed out successfully.";
};

async function initialize() {
  try {
    const url = new URL(window.location.href);
    const code = url.searchParams.get("code");

    if (code) {
      status.textContent = "Completing sign in...";

      const { error } =
        await db.auth.exchangeCodeForSession(code);

      history.replaceState(
        {},
        document.title,
        window.location.pathname
      );

      if (error) {
        status.textContent = error.message;
        return;
      }
    }

    const { data, error } = await db.auth.getUser();

    if (error && error.name !== "AuthSessionMissingError") {
      status.textContent = error.message;
    }

    showUser(data?.user ?? null);

    if (data?.user) {
      status.textContent = "Google login successful!";
    }
  } catch (error) {
    status.textContent = "Authentication error.";
    console.error(error);
  }
}

db.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_IN" || event === "INITIAL_SESSION") {
    showUser(session?.user ?? null);

    if (session?.user) {
      status.textContent = "Google login successful!";
    }
  }

  if (event === "SIGNED_OUT") {
    showUser(null);
    status.textContent = "Signed out successfully.";
  }
});


document.querySelector("#test-link").onclick = async () => {
  const button = document.querySelector("#test-link");

  button.disabled = true;
  status.textContent = "Preparing secure itch.io linking...";

  try {
    // Ask our authenticated Supabase function
    // to create a temporary linking ticket.
    const { data, error } = await db.functions.invoke(
      "itch-link-prepare",
      { body: {} }
    );

    if (error || !data?.prepared ||
        typeof data.launch_ticket !== "string") {
      status.textContent =
        "Could not prepare account linking.";
      button.disabled = false;
      return;
    }

    // Submit the ticket through HTTPS POST.
    // Do not put the ticket in a URL or save it.
    const form = document.createElement("form");

    form.method = "POST";
    form.action =
      "https://wetnwnwkeednykajzqqs.supabase.co" +
      "/functions/v1/itch-link-launch";

    const field = document.createElement("input");
    field.type = "hidden";
    field.name = "launch_ticket";
    field.value = data.launch_ticket;

    form.appendChild(field);
    document.body.appendChild(form);

    status.textContent = "Redirecting to itch.io...";
    form.submit();

  } catch (error) {
    console.error("Account linking failed");
    status.textContent =
      "Unable to start itch.io account linking.";
    button.disabled = false;
  }
};


initialize();
</script>
</body>
</html>
